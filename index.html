
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kindred</title>
    <meta name="description" content="An AI-powered space for couples to deepen their connection." />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { 
        --bg-primary: #121212; 
        --bg-primary-rgb: 18, 18, 18;
        --text-primary: #FDFCF0; 
        --text-primary-rgb: 253, 252, 240;
        --accent-green: #A8FFB5;
        --accent-pink: #FF85B3;
        --orb-color: #00D2FF; /* Signature Kindred Cyan */
        --mouse-x: 50%;
        --mouse-y: 50%;
      }

      body.light-mode {
        --bg-primary: #FDFCF0;
        --bg-primary-rgb: 253, 252, 240;
        --text-primary: #121212;
        --text-primary-rgb: 18, 18, 18;
        --accent-green: #2B6B3D;
        --accent-pink: #A62D5F;
      }

      html { 
        scroll-behavior: smooth; 
        font-size: 16px; 
      }
      body { 
        font-family: 'Cardo', serif; 
        background-color: var(--bg-primary); 
        color: var(--text-primary); 
        margin: 0; 
        overflow-x: hidden; 
        -webkit-tap-highlight-color: transparent; 
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      h1, h2, h3, h4, .heading-font { 
        font-family: 'Montserrat', sans-serif; 
        letter-spacing: -0.01em; 
        font-weight: 600; 
      }
      
      .text-clamp-4xl { font-size: clamp(1.85rem, 6vw, 2.5rem); line-height: 1.15; }
      .text-clamp-5xl { font-size: clamp(2.35rem, 9vw, 3.5rem); line-height: 1.1; }
      .text-clamp-6xl { font-size: clamp(3rem, 11vw, 5rem); line-height: 1; }
      .text-clamp-7xl { font-size: clamp(4rem, 14vw, 7rem); line-height: 1; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      .orb { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(100px); opacity: 0.05; z-index: -1; pointer-events: none; will-change: transform; }
      .orb-pink { background: var(--accent-pink); top: -10%; right: -10%; animation: float-pink 25s infinite alternate ease-in-out; }
      .orb-green { background: var(--accent-green); bottom: -10%; left: -10%; animation: float-green 30s infinite alternate ease-in-out; }
      
      /* The Dynamic Following Orb - Stronger & Consistent Color */
      .following-orb {
        position: fixed;
        width: 50vmax;
        height: 50vmax;
        top: 0;
        left: 0;
        transform: translate(calc(var(--mouse-x) - 50%), calc(var(--mouse-y) - 50%));
        background: radial-gradient(circle at center, var(--orb-color) 0%, transparent 70%);
        filter: blur(60px);
        opacity: 0.28; /* Increased from 0.12 */
        pointer-events: none;
        z-index: -1;
        will-change: transform;
        transition: transform 0.18s cubic-bezier(0.33, 1, 0.68, 1);
        mix-blend-mode: screen;
      }

      body.light-mode .following-orb {
        opacity: 0.15; /* Increased from 0.06 */
        mix-blend-mode: multiply; /* Better for light backgrounds */
      }

      .sensory-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.2;
        mix-blend-mode: soft-light;
      }

      body.light-mode .sensory-layer {
        background: radial-gradient(
          circle at var(--mouse-x) var(--mouse-y),
          rgba(0, 0, 0, 0.05) 0%,
          rgba(0, 0, 0, 0) 50%
        );
      }

      body:not(.light-mode) .sensory-layer {
        background: radial-gradient(
          circle at var(--mouse-x) var(--mouse-y),
          var(--orb-color) 0%,
          transparent 40%
        );
      }
      
      @keyframes float-pink { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 100% { transform: translate(-20%, 20%) rotate(15deg) scale(1.15); } }
      @keyframes float-green { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 100% { transform: translate(20%, -20%) rotate(-15deg) scale(1.15); } }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }
      .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      .bg-theme-inverted { background-color: var(--text-primary); color: var(--bg-primary); }
      .text-theme-primary { color: var(--text-primary); }
      .bg-theme-primary { background-color: var(--bg-primary); }

      input, textarea { 
        color: var(--text-primary);
        background: transparent;
      }
      input::placeholder, textarea::placeholder { 
        color: var(--text-primary); 
        opacity: 0.3;
      }

      .glass-card { 
        background: rgba(var(--text-primary-rgb), 0.04); 
        border: 1px solid rgba(var(--text-primary-rgb), 0.08); 
        backdrop-filter: blur(12px); 
      }
      
      :focus-visible {
        outline: 2px solid var(--accent-green);
        outline-offset: 4px;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "@google/genai": "https://esm.sh/@google/genai@1.27.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.0",
    "markdown-to-jsx": "https://esm.sh/markdown-to-jsx@9.7.3",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?deps=react@19.0.0,react-dom@19.0.0",
    "@supabase/ssr": "https://esm.sh/@supabase/ssr@0.8.0",
    "zod": "https://esm.sh/zod@3.23.8",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.62.7?deps=react@19.0.0,react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body class="min-h-screen antialiased">
    <div class="sensory-layer"></div>
    <div class="following-orb" aria-hidden="true"></div>
    <div class="orb orb-pink" aria-hidden="true"></div>
    <div class="orb orb-green" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
